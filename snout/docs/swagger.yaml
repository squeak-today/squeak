basePath: /
definitions:
  models.AudioHealthResponse:
    properties:
      status:
        example: live
        type: string
    required:
    - status
    type: object
  models.AudiobookResponse:
    properties:
      expires_in:
        example: 300
        type: integer
      url:
        example: https://bucket.s3.amazonaws.com/path/to/file?signed-params
        type: string
    required:
    - expires_in
    - url
    type: object
  models.BillingAccountResponse:
    properties:
      canceled:
        example: false
        type: boolean
      expiration:
        example: "2025-01-01T00:00:00Z"
        type: string
      plan:
        example: PRO
        type: string
    required:
    - canceled
    - expiration
    - plan
    type: object
  models.BillingAccountUsageResponse:
    properties:
      max_natural_tts_usage:
        example: 100
        type: integer
      max_premium_audiobooks_usage:
        example: 100
        type: integer
      max_premium_stt_usage:
        example: 100
        type: integer
      natural_tts_usage:
        example: 10
        type: integer
      premium_audiobooks_usage:
        example: 10
        type: integer
      premium_stt_usage:
        example: 10
        type: integer
    required:
    - max_natural_tts_usage
    - max_premium_audiobooks_usage
    - max_premium_stt_usage
    - natural_tts_usage
    - premium_audiobooks_usage
    - premium_stt_usage
    type: object
  models.CancelIndividualSubscriptionRequest:
    type: object
  models.CancelIndividualSubscriptionResponse:
    properties:
      canceled_plan:
        example: PREMIUM
        type: string
      current_expiration:
        example: "2025-03-24T12:00:00Z"
        type: string
      success:
        example: true
        type: boolean
    required:
    - canceled_plan
    - current_expiration
    - success
    type: object
  models.CreateIndividualCheckoutSessionRequest:
    type: object
  models.CreateIndividualCheckoutSessionResponse:
    properties:
      redirect_url:
        example: https://checkout.stripe.com/c/pay/123
        type: string
    required:
    - redirect_url
    type: object
  models.ERROR_CODE:
    enum:
    - PROFILE_NOT_FOUND
    - NO_TRANSCRIPT
    - AUTH_REQUIRED
    - USAGE_LIMIT_REACHED
    - USAGE_RESTRICTED
    type: string
    x-enum-varnames:
    - PROFILE_NOT_FOUND
    - NO_TRANSCRIPT
    - AUTH_REQUIRED
    - USAGE_LIMIT_REACHED
    - USAGE_RESTRICTED
  models.ErrorResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/models.ERROR_CODE'
        enum:
        - PROFILE_NOT_FOUND
        - NO_TRANSCRIPT
        - AUTH_REQUIRED
        - USAGE_LIMIT_REACHED
        - USAGE_RESTRICTED
        example: PROFILE_NOT_FOUND
      error:
        example: Something went wrong
        type: string
    required:
    - error
    type: object
  models.EvaluateAnswerRequest:
    properties:
      answer:
        example: Hello
        type: string
      cefr:
        example: B1
        type: string
      content:
        example: Bonjour, comment ça va?
        type: string
      question:
        example: What does 'bonjour' mean?
        type: string
    required:
    - answer
    - cefr
    - content
    - question
    type: object
  models.EvaluateAnswerResponse:
    properties:
      evaluation:
        example: PASS
        type: string
      explanation:
        example: Perfect!
        type: string
    required:
    - evaluation
    - explanation
    type: object
  models.GetNewsResponse:
    properties:
      cefr_level:
        example: B1
        type: string
      content:
        example: Le contenu complet de l'article...
        type: string
      content_type:
        example: News
        type: string
      date_created:
        example: "2024-02-26"
        type: string
      dictionary:
        $ref: '#/definitions/storage.Dictionary'
      language:
        example: French
        type: string
      preview_text:
        example: Un résumé des nouvelles musicales...
        type: string
      sources:
        items:
          $ref: '#/definitions/storage.Source'
        type: array
      title:
        example: L'actualité musicale en bref
        type: string
      topic:
        example: Music
        type: string
    required:
    - cefr_level
    - content
    - content_type
    - date_created
    - dictionary
    - language
    - preview_text
    - sources
    - title
    - topic
    type: object
  models.GetProfileResponse:
    properties:
      daily_questions_goal:
        example: 3
        minimum: 0
        type: integer
      interested_topics:
        example:
        - '["NBA"]'
        items:
          type: string
        type: array
      learning_language:
        example: French
        type: string
      skill_level:
        example: B1
        type: string
      username:
        example: connortbot
        type: string
    required:
    - interested_topics
    - learning_language
    - skill_level
    - username
    type: object
  models.GetQuestionRequest:
    properties:
      cefr_level:
        example: B1
        type: string
      content_type:
        example: News
        type: string
      id:
        example: "123"
        type: string
      question_type:
        enum:
        - vocab
        - understanding
        example: vocab
        type: string
    required:
    - cefr_level
    - content_type
    - id
    - question_type
    type: object
  models.GetQuestionResponse:
    properties:
      question:
        example: What does 'bonjour' mean?
        type: string
    required:
    - question
    type: object
  models.GetStoryPageResponse:
    properties:
      cefr_level:
        example: B1
        type: string
      content:
        example: Le contenu complet de l'article...
        type: string
      content_type:
        example: Story
        type: string
      date_created:
        example: "2024-02-26"
        type: string
      language:
        example: French
        type: string
      pages:
        example: 10
        type: integer
      preview_text:
        example: Un résumé des nouvelles musicales...
        type: string
      title:
        example: L'actualité musicale en bref
        type: string
      topic:
        example: Music
        type: string
    required:
    - cefr_level
    - content
    - content_type
    - date_created
    - language
    - pages
    - preview_text
    - title
    - topic
    type: object
  models.GetStoryQNAContextResponse:
    properties:
      context:
        example: Le contexte de l'histoire...
        type: string
    required:
    - context
    type: object
  models.IncrementProgressResponse:
    properties:
      date:
        example: "2025-02-26T00:00:00Z"
        type: string
      goal_met:
        example: true
        type: boolean
      questions_completed:
        example: 5
        minimum: 0
        type: integer
      user_id:
        example: "123"
        type: string
    required:
    - date
    - goal_met
    - user_id
    type: object
  models.NewsItem:
    properties:
      audiobook_tier:
        example: NONE
        type: string
      cefr_level:
        example: B1
        type: string
      created_at:
        example: "2024-02-26T13:01:13.390612Z"
        type: string
      date_created:
        example: "2024-02-26"
        type: string
      id:
        example: "123"
        type: string
      language:
        example: French
        type: string
      preview_text:
        example: Un résumé des nouvelles musicales...
        type: string
      title:
        example: L'actualité musicale en bref
        type: string
      topic:
        example: Music
        type: string
    required:
    - audiobook_tier
    - cefr_level
    - created_at
    - date_created
    - id
    - language
    - preview_text
    - title
    - topic
    type: object
  models.SpeechToTextRequest:
    properties:
      audio_content:
        example: base64-encoded-audio-content
        type: string
      language_code:
        example: en-US
        type: string
      premium:
        example: false
        type: boolean
    required:
    - audio_content
    - language_code
    type: object
  models.SpeechToTextResponse:
    properties:
      transcript:
        example: Hello, how are you?
        type: string
    required:
    - transcript
    type: object
  models.StoryItem:
    properties:
      audiobook_tier:
        example: NONE
        type: string
      cefr_level:
        example: B1
        type: string
      created_at:
        example: "2024-02-26T13:01:13.390612Z"
        type: string
      date_created:
        example: "2024-02-26"
        type: string
      id:
        example: "123"
        type: string
      language:
        example: French
        type: string
      preview_text:
        example: Un résumé des nouvelles musicales...
        type: string
      title:
        example: L'actualité musicale en bref
        type: string
      topic:
        example: Music
        type: string
    required:
    - audiobook_tier
    - cefr_level
    - created_at
    - date_created
    - id
    - language
    - preview_text
    - title
    - topic
    type: object
  models.StreakResponse:
    properties:
      completed_today:
        example: true
        type: boolean
      streak:
        example: 7
        minimum: 0
        type: integer
    required:
    - completed_today
    type: object
  models.TextToSpeechRequest:
    properties:
      language_code:
        example: en-US
        type: string
      natural:
        example: false
        type: boolean
      text:
        example: Hello, how are you?
        type: string
      voice_name:
        example: en-US-Standard-A
        type: string
    required:
    - language_code
    - text
    - voice_name
    type: object
  models.TextToSpeechResponse:
    properties:
      audio_content:
        example: base64-encoded-audio-content
        type: string
    required:
    - audio_content
    type: object
  models.TodayProgressResponse:
    properties:
      date:
        example: "2025-02-26T00:00:00Z"
        type: string
      goal_met:
        example: true
        type: boolean
      questions_completed:
        example: 5
        minimum: 0
        type: integer
      user_id:
        example: "123"
        type: string
    required:
    - date
    - goal_met
    - user_id
    type: object
  models.TranslateRequest:
    properties:
      sentence:
        example: Hello, how are you?
        type: string
      source:
        example: en
        type: string
      target:
        example: fr
        type: string
    required:
    - sentence
    - source
    - target
    type: object
  models.TranslateResponse:
    properties:
      sentence:
        example: Bonjour, comment allez-vous?
        type: string
    type: object
  models.UpsertProfileRequest:
    properties:
      daily_questions_goal:
        example: 3
        minimum: 0
        type: integer
      interested_topics:
        example:
        - '["NBA"]'
        items:
          type: string
        type: array
      learning_language:
        example: French
        type: string
      skill_level:
        example: B1
        type: string
      username:
        example: johndoe
        type: string
    required:
    - interested_topics
    - learning_language
    - skill_level
    - username
    type: object
  models.UpsertProfileResponse:
    properties:
      id:
        example: 123
        minimum: 0
        type: integer
      message:
        example: Profile updated successfully
        type: string
    required:
    - message
    type: object
  models.WebhookResponse:
    properties:
      received:
        type: boolean
      type:
        type: string
    type: object
  storage.Dictionary:
    properties:
      translations:
        properties:
          sentences:
            additionalProperties:
              type: string
            type: object
          words:
            additionalProperties:
              type: string
            type: object
        type: object
    type: object
  storage.Source:
    properties:
      content:
        type: string
      score:
        type: number
      title:
        type: string
      url:
        type: string
    type: object
  whisker_types.ContentJob:
    properties:
      created_at:
        type: string
      database_id:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/whisker_types.ContentJobStatus'
      user_id:
        type: string
    type: object
  whisker_types.ContentJobStatus:
    enum:
    - creation
    - pending
    - running
    - complete
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - ContentJobStatusCreation
    - ContentJobStatusPending
    - ContentJobStatusRunning
    - ContentJobStatusComplete
    - ContentJobStatusFailed
    - ContentJobStatusCancelled
  workspaces.Content:
    properties:
      database_id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
      name:
        example: My Content
        type: string
    required:
    - database_id
    - id
    - name
    type: object
  workspaces.CreateContentRequest:
    properties:
      link:
        description: |-
          Eventually need to build a more robust request body for other
          kinds of content uploads
        type: string
      name:
        type: string
    required:
    - link
    - name
    type: object
  workspaces.CreateContentResponse:
    type: object
  workspaces.CreateDatabaseRequest:
    properties:
      name:
        example: My Database
        type: string
      type:
        allOf:
        - $ref: '#/definitions/workspaces.DatabaseType'
        example: content
    required:
    - name
    - type
    type: object
  workspaces.CreateDatabaseResponse:
    properties:
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
    required:
    - id
    type: object
  workspaces.CreateWorkspaceRequest:
    properties:
      name:
        example: My Workspace
        type: string
    required:
    - name
    type: object
  workspaces.CreateWorkspaceResponse:
    properties:
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
    required:
    - id
    type: object
  workspaces.Database:
    properties:
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
      name:
        example: My Database
        type: string
      type:
        allOf:
        - $ref: '#/definitions/workspaces.DatabaseType'
        example: content
      workspace_id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
    required:
    - id
    - name
    - type
    - workspace_id
    type: object
  workspaces.DatabaseType:
    enum:
    - content
    type: string
    x-enum-varnames:
    - DatabaseTypeContent
  workspaces.GetIncompleteJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/whisker_types.ContentJob'
        type: array
    type: object
  workspaces.GetWorkspacesResponse:
    properties:
      workspaces:
        items:
          $ref: '#/definitions/workspaces.Workspace'
        type: array
    required:
    - workspaces
    type: object
  workspaces.QueryDatabaseRequest:
    properties:
      type:
        allOf:
        - $ref: '#/definitions/workspaces.DatabaseType'
        example: content
    required:
    - type
    type: object
  workspaces.QueryDatabaseResponse:
    properties:
      content:
        items:
          $ref: '#/definitions/workspaces.Content'
        type: array
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
      name:
        example: My Database
        type: string
      type:
        allOf:
        - $ref: '#/definitions/workspaces.DatabaseType'
        example: content
      workspace_id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
    required:
    - id
    - name
    - type
    - workspace_id
    type: object
  workspaces.Workspace:
    properties:
      id:
        example: xxxx-xxxx-xxxx-xxxx
        type: string
      name:
        example: My Workspace
        type: string
    required:
    - id
    - name
    type: object
  workspaces.WorkspacesSummary:
    properties:
      databases:
        items:
          $ref: '#/definitions/workspaces.Database'
        type: array
      workspaces:
        items:
          $ref: '#/definitions/workspaces.Workspace'
        type: array
    required:
    - databases
    - workspaces
    type: object
host: api.squeak.today
info:
  contact: {}
  description: Backend API for Squeak Platform
  title: Squeak API
  version: "1.0"
paths:
  /audio:
    get:
      consumes:
      - application/json
      description: Check if the audio service is live
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AudioHealthResponse'
      summary: Check audio service health
      tags:
      - audio
  /audio/audiobook:
    get:
      consumes:
      - application/json
      description: Get audiobook for a news_id
      parameters:
      - description: News ID
        in: query
        name: news_id
        type: string
      - description: Story ID
        in: query
        name: story_id
        type: string
      - description: story
        in: query
        name: type
        required: true
        type: string
      - description: "1"
        in: query
        name: page
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AudiobookResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get audiobook
      tags:
      - audio
  /audio/stt:
    post:
      consumes:
      - application/json
      description: Convert speech audio to text
      parameters:
      - description: Speech to text request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SpeechToTextRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SpeechToTextResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Speech to text
      tags:
      - audio
  /audio/translate:
    post:
      consumes:
      - application/json
      description: Translate text from source language to target language
      parameters:
      - description: Translation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.TranslateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TranslateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Translate text
      tags:
      - audio
  /audio/tts:
    post:
      consumes:
      - application/json
      description: Convert text to speech audio
      parameters:
      - description: Text to speech request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.TextToSpeechRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TextToSpeechResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Text to speech
      tags:
      - audio
  /billing:
    get:
      consumes:
      - application/json
      description: Check Billing Account
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BillingAccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Check Billing Account
      tags:
      - billing
  /billing/cancel-subscription-eop:
    post:
      consumes:
      - application/json
      description: Cancel a Stripe individual subscription at the end of the period
      parameters:
      - description: Cancel subscription request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CancelIndividualSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CancelIndividualSubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Cancel a Stripe individual subscription at the end of the period
      tags:
      - billing
  /billing/create-checkout-session:
    post:
      consumes:
      - application/json
      description: Creates a checkout session and redirects to Stripe's payment page
      parameters:
      - description: Create checkout session request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateIndividualCheckoutSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Redirect to Stripe Checkout
          schema:
            $ref: '#/definitions/models.CreateIndividualCheckoutSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a Stripe checkout session (individual)
      tags:
      - billing
  /billing/usage:
    get:
      consumes:
      - application/json
      description: Get Billing Account Usage, assumes free plan
      parameters:
      - description: Plan
        in: query
        name: plan
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BillingAccountUsageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get Billing Account Usage
      tags:
      - billing
  /news:
    get:
      consumes:
      - application/json
      description: Get news content by ID
      parameters:
      - description: Content ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GetNewsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get news content
      tags:
      - news
  /news/query:
    get:
      consumes:
      - application/json
      description: Get news content by ID
      parameters:
      - description: Language
        in: query
        name: language
        required: true
        type: string
      - description: CEFR
        in: query
        name: cefr
        required: true
        type: string
      - description: Subject
        in: query
        name: subject
        required: true
        type: string
      - description: Page
        in: query
        name: page
        required: true
        type: string
      - description: Page size
        in: query
        name: pagesize
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.NewsItem'
            type: array
      summary: Get news content
      tags:
      - news
  /profile:
    get:
      consumes:
      - application/json
      description: Get the user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GetProfileResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get user profile
      tags:
      - profile
  /profile/upsert:
    post:
      consumes:
      - application/json
      description: Create or update the user's profile
      parameters:
      - description: Profile information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpsertProfileRequest'
      produces:
